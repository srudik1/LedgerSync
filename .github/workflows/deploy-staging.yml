name: Deploy Staging
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ledgersync-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate staging D1 target
        run: |
          grep -q '0287e219-b02c-4255-8de4-9cfac8155348' wrangler.staging.jsonc
          grep -q 'ledger-sync-db-staging' wrangler.staging.jsonc
          if grep -q '6d295d12-9998-4b26-b70d-a07173edfca0' wrangler.staging.jsonc; then exit 1; fi
      - name: Deploy staging
        run: npx wrangler deploy --config wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
